<!DOCTYPE html>
<html lang="en"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | DQPM Collaboration</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">

    <style>
        :root {
            /* Light grey-blue modern background */
            --background-body: #b8d1d9;
            --text-main: #333333;
            --links: #133275;
            /* INCREASED: Base font size for simple text readability */
            font-size: 20px; 
        }

        body {
            max-width: 900px; 
            line-height: 1.6;
            padding: 1rem;
            background-color: var(--background-body);
        }

        header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e2e2;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap; 
        }

        header h1 {
            margin: 0;
            /* Adjusted for balance */
            font-size: 1.8rem; 
            color: var(--links);
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            font-weight: 600;
            /* INCREASED: Larger navigation links */
            font-size: 1.1rem; 
            transition: color 0.3s;
        }

        nav a:hover {
            color: #003d80;
            text-decoration: underline;
        }

        /* REDUCED: Subsections titles sizing for home/content */
        main h2 { font-size: 1.4rem; margin-top: 1.5rem; }
        main h3 { font-size: 1.2rem; margin-top: 1.2rem; }
        main h4 { font-size: 1.1rem; }

        /* Mobile Optimizations */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.2rem;
            }
            
            nav {
                margin-left: 0;
                width: 100%;
                justify-content: space-between;
            }

            nav a {
                font-size: 1rem; /* Slightly smaller on mobile to fit */
            }
            
            :root { font-size: 18px; }
        }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e2e2; padding-bottom: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
    
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="/images/logo.png" alt="DQPM Logo" style="height: 60px; width: auto;">
            <h1 style="margin: 0; font-size: 1.8rem; color: var(--links);">{{ .Site.Title }}</h1> 
        </div>

        <nav>
          {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" style="text-decoration: none; font-weight: 600; font-size: 1.1rem; margin-left: 15px;">{{ .Name }}</a>
          {{ end }}
        </nav>
    </header>

    <main>
        {{ .Content }}
    </main>

    <footer style="margin-top: 4rem; border-top: 1px solid #e2e2e2; padding-top: 1rem; font-size: 0.85rem; opacity: 0.7;">
        <p>© 2026 DQPM Project | Built with Hugo & Water.css</p>
    </footer>
</body>
</html>
